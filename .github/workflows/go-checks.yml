name: Go checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Test, vet, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build server
        run: go build -o /tmp/gemini-web-to-api ./cmd/server/main.go
