services:
  gateway:
    build: .
    container_name: gemini-web-to-api
    ports:
      - "127.0.0.1:4981:4981"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "4981"
      APP_ENV: production
      API_AUTH_ENABLED: "${API_AUTH_ENABLED:-true}"
      GATEWAY_DATA_DIR: /home/appuser/.gateway
      DASHBOARD_ENABLED: "${DASHBOARD_ENABLED:-true}"
      DASHBOARD_LOCAL_PORT: "true"
    restart: unless-stopped
    volumes:
      - gateway-data:/home/appuser/.gateway
      - gateway-cookies:/home/appuser/.cookies
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4981/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  gateway-data:
  gateway-cookies:
